id = "json"
display_name = "vscode-json-language-server"
languages = ["json"]
notes = "requires Node.js and npm; part of the vscode-langservers-extracted package"

[verify]
command = "vscode-json-language-server"
args = ["--version"]

[install.windows]
shell = "npm install -g vscode-langservers-extracted"

[install.linux]
shell = "npm install -g vscode-langservers-extracted"

[install.macos]
shell = "npm install -g vscode-langservers-extracted"
