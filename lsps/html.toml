id = "html"
display_name = "vscode-html-language-server"
languages = ["html"]
notes = "requires Node.js and npm; part of the vscode-langservers-extracted package"

[verify]
command = "vscode-html-language-server"
args = ["--version"]

[install.windows]
shell = "npm install -g vscode-langservers-extracted"

[install.linux]
shell = "npm install -g vscode-langservers-extracted"

[install.macos]
shell = "npm install -g vscode-langservers-extracted"
