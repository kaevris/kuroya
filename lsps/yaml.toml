id = "yaml"
display_name = "yaml-language-server"
languages = ["yaml"]
notes = "requires Node.js and npm"

[verify]
command = "yaml-language-server"
args = ["--version"]

[install.windows]
shell = "npm install -g yaml-language-server"

[install.linux]
shell = "npm install -g yaml-language-server"

[install.macos]
shell = "npm install -g yaml-language-server"
