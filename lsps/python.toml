id = "python"
display_name = "pyright"
languages = ["python"]
notes = "requires Node.js and npm; installs the pyright-langserver command used by the built-in python config"

[verify]
command = "pyright-langserver"
args = ["--version"]

[install.windows]
shell = "npm install -g pyright"

[install.linux]
shell = "npm install -g pyright"

[install.macos]
shell = "npm install -g pyright"
