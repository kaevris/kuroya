id = "go"
display_name = "gopls"
languages = ["go"]
notes = "requires the Go toolchain; make sure GOPATH/bin (or GOBIN) is on PATH"

[verify]
command = "gopls"
args = ["version"]

[install.windows]
shell = "go install golang.org/x/tools/gopls@latest"

[install.linux]
shell = "go install golang.org/x/tools/gopls@latest"

[install.macos]
shell = "go install golang.org/x/tools/gopls@latest"
